<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>天外 Online - 技能樹配點器</title>
  <link rel="stylesheet" href="/mo_data/js/skills.css">
</head>
<body>

  <!-- 遊戲介面主框 -->
  <div class="game-window">
    
    <!-- 1. 頂部系別頁籤 -->
    <nav id="tabsContainer" class="tabs-nav">
      <!-- 由 JS 動態繪製 (例如：斬刀技、御武術、武技...) -->
    </nav>

    <!-- 2. 頂部資訊列 (職業選擇 & 點數) -->
    <div class="status-bar">
      <div class="job-select-wrapper">
        <select id="jobSelect"></select>
      </div>
      <div class="points-badge">
        <span class="point-label">POINT</span>
        <span id="remainingPoints" class="point-value">120</span>
      </div>
      <button id="resetBtn" class="btn-reset">重置</button>
    </div>

    <!-- 3. 技能樹核心區塊 -->
    <main class="tree-viewport">
      <div id="treeContainer" class="tree-grid">
        <!-- 技能節點由 JS 動態生成 -->
      </div>
    </main>

  </div>

  <!-- 4. Hover 技能說明 Tooltip -->
  <div id="tooltip" class="skill-tooltip hidden">
    <div id="ttName" class="tt-title">技能名稱</div>
    <div id="ttType" class="tt-type">型態 / 種類</div>
    <div id="ttReq" class="tt-req">等級需求</div>
    <hr class="tt-divider">
    <div id="ttDesc" class="tt-desc">技能詳細說明...</div>
  </div>

  <!-- 導入 ES Module 主程式 -->
  <script type="module" src="/mo_data/js/skills.js"></script>
</body>
</html>
