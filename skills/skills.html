<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <title>技能模擬器 | MoData</title>
    <link rel="stylesheet" href="/mo_data/css/styles.css" />
    <link rel="stylesheet" href="/mo_data/css/nav.css" />
    <link rel="stylesheet" href="/mo_data/css/skills.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
<body>
  <div id="nav-container"></div>
  <script src="/mo_data/js/componentsLoader.js"></script>

  <!-- 遊戲介面主框 (改用 simulator-container 讓 CSS 抓得到) -->
  <div class="simulator-container">
  <!-- 頁籤選單 -->
  <nav id="tabsContainer" class="tabs-nav"></nav>
    
    <!-- 頂部資訊列 (職業選擇 & 點數) -->
<div class="status-bar">
  
  <!-- 上層：設定選項區塊 (卡片式小框包覆) -->
  <div class="controls-config-group">
    
    <!-- 選擇職業小框 -->
    <div class="config-card">
      <label for="jobSelect">選擇職業：</label>
      <select id="jobSelect"></select>
    </div>

    <!-- 轉生次數小框 -->
    <div class="config-card">
      <label for="rebirthSelect">轉生次數：</label>
      <select id="rebirthSelect">
        <option value="0">未轉生 (+0點)</option>
        <option value="1">轉生 1 次 (+10點)</option>
        <option value="2">轉生 2 次 (+20點)</option>
        <option value="3">轉生 3 次 (+30點)</option>
      </select>
    </div>

    <!-- 極限等級小框 -->
    <div class="config-card">
      <label class="checkbox-label" for="limitLevelCheck">
        <input type="checkbox" id="limitLevelCheck"> 開啟極限 410 (+10點)
      </label>
    </div>

    <!-- 自動扣除門檻小框 -->
    <div class="config-card">
      <label class="checkbox-label" for="skipBaseJobCheck">
        <input type="checkbox" id="skipBaseJobCheck"> 自動扣除 120 點基礎技能點 (直接解鎖轉職)
      </label>
    </div>

  </div>

  <!-- 下層：點數與重置按鈕 -->
  <div class="controls-action-group">
    <div class="point-status-bar">
      <!-- 已點點數 -->
      <div class="point-badge used">
        <span class="label">已用點數</span>
        <span class="value" id="usedPoints">0</span>
        <span class="sub-label" id="baseJobPointsText">(基礎: 0/120)</span>
      </div>

      <!-- 剩餘點數 -->
      <div class="point-badge remaining">
        <span class="label">可用點數</span>
        <span class="value" id="remainingPoints">200</span>
      </div>
    </div>

    <button id="resetBtn" class="btn-reset">重置配點</button>
  </div>

</div>

    <!-- 技能樹核心區塊 -->
    <main class="tree-viewport">
      <div id="treeContainer" class="tree-columns-wrapper">
        <!-- 技能直欄由 JS 動態生成 -->
      </div>
    </main>

  </div>

  <!-- Hover 技能說明 Tooltip -->
  <div id="tooltip" class="skill-tooltip hidden">
    <div id="ttName" class="tt-title">技能名稱</div>
    <div id="ttType" class="tt-type">型態 / 種類</div>
    <div id="ttReq" class="tt-req">等級需求</div>
    <hr class="tt-divider">
    <div id="ttDesc" class="tt-desc">技能詳細說明...</div>
  </div>

  <!-- 導入 ES Module 主程式 -->
  <script type="module" src="/mo_data/js/skills.js"></script>

  <button id="backToTop" title="回到頂部">▲</button>
  <div id="footer-container"></div>
</body>
</html>
